{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="same-origin">
  <meta name="theme-color" content="#2f3a24">
  <title>{% block title %}{{ box.title|default:"Suggestion Box" }}{% endblock %}</title>
  <link rel="icon" href="{% static 'icons/icon.svg' %}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{% static 'icons/icon-192.png' %}">
  <link rel="manifest" href="{% url 'box:manifest' %}">
  <link rel="preload" href="{% static 'fonts/saira-latin-400-normal.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <link rel="stylesheet" href="{% static 'css/themes.css' %}">
  {% block head %}{% endblock %}
</head>
<body class="theme-{{ box.theme|default:'camo' }}" {% block body_attrs %}{% endblock %}>
  <div class="page-bg" {% if box.background_image_url %}style="--bg-image: linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.45)), url('{{ box.background_image_url|urlencode:':/?&=.%' }}');"{% endif %}>
    {% block body %}{% endblock %}
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
